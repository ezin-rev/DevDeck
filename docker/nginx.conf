# nginx settings for the DevDeck container (see ../Dockerfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Small and fast
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Built files have their content hash in the name: cache them for a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Always fetch fresh: the offline worker and the app manifest
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Health check for Docker / Compose / Kubernetes
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Every page has its own folder (dist/<page>/index.html). Unknown addresses — e.g. tools from
    # plugins installed in the app — get the app shell (404.html), which shows the right page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ /404.html;
    }
}

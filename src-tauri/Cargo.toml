[package]
name = "devdeck"
version = "1.0.0"
description = "DevDeck — friendly developer tools, as a desktop app"
authors = ["ezin-rev"]
license = "MIT"
repository = "https://github.com/ezin-rev/devdeck"
edition = "2021"
rust-version = "1.77"

[lib]
# The app logic lives in a library so it could also be built for mobile later.
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, faster release builds.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

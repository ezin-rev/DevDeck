<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Friendly everyday tools for developers and everyone: convert, encode, format, generate and compare text." />
    <title>DevDeck</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply saved look before the page draws (same keys as src/prefs.jsx).
      try {
        var p = Object.assign({ palette: "contrast", mode: "dark", nav: "tabs", view: "cards", panels: "side", density: "comfortable", text: "normal", width: "centered" }, JSON.parse(localStorage.getItem("aurora-prefs-v2") || "{}"));
        var d = p.mode === "dark" || (p.mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var ds = document.documentElement.dataset;
        ds.theme = d ? "dark" : "light"; ds.palette = p.palette; ds.fx = p.palette === "aurora" ? "vivid" : "soft";
        ds.nav = p.nav; ds.view = p.view; ds.panels = p.panels; ds.density = p.density; ds.text = p.text; ds.width = p.width;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
